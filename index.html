<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Space</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        p.bio {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            padding: 14px 20px;
            background: #ffffff;
            color: #4a5568;
            text-decoration: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #edf2f7;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background: #6c5ce7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 프로필 이미지 (원하는 이미지 링크나 파일명으로 교체 가능) -->
        <img src="https://picsum.photos/300/300" alt="Profile" class="profile-img">

        <!-- 제목 및 소개글 -->
        <h1>Welcome to My Space ✨</h1>
        <p class="bio">소중한 기록과 최애를 담는 공간입니다.<br>방문해 주셔서 감사합니다!</p>

        <!-- 버튼 링크 목록 -->
        <div class="links">
            <a href="https://twitter.com" target="_blank" class="link-btn">X (Twitter) 바로가기</a>
            <a href="https://instagram.com" target="_blank" class="link-btn">Instagram 바로가기</a>
            <a href="https://youtube.com" target="_blank" class="link-btn">YouTube 추천 영상</a>
        </div>

        <div class="footer">
            © 2026 My Space. All rights reserved.
        </div>
    </div>

</body>
</html>
